services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kabadi
      POSTGRES_PASSWORD: kabadi
      POSTGRES_DB: kabadiwala
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kabadi -d kabadiwala"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    environment:
      ENV: development
      DEMO_MODE: "true"
      DATABASE_URL: postgresql+psycopg://kabadi:kabadi@db:5432/kabadiwala
      JWT_SECRET: kabadiwala-connect-demo-jwt-secret-32b
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173
      UPLOAD_DIR: /app/uploads
      OTP_DEV_CODE: "123456"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - uploads:/app/uploads
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
